name: Database from zero

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/operational-maturity-v1, feature/dentflow-v2-maturity-2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  from-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.67.1
      - name: Start isolated local database
        run: supabase start -x studio,imgproxy,inbucket,storage-api,edge-runtime,logflare,vector,supavisor
      - name: Apply all migrations from zero
        run: supabase db reset --local --no-seed
      - name: Validate final schema, RLS, grants and relationships
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"/\1/p')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/database-from-zero.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/contact-interactions-rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/global-search-rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/saved-views-rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/operational-integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/operational-workflows-e2e.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/clarity-scoring.sql
